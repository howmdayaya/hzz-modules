<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --color: #48b3ad;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--color);
    }

    .container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container .card {
      position: relative;
      width: 340px;
      height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      cursor: pointer;
      transition: .5s;
    }
    .container .card:hover {
      height: 400px;
    }

    .container .card .img-box {
      position:absolute;
      inset: 20px 20px 50px 20px;
      background-color: blue;
      border-radius: 15px;
      transition: .5s;
    }
    .container .card:hover .img-box {
      inset: -50px 60px 300px 60px;
      box-shadow: 0 0 0 10px var(--color);
    }

    .container .card .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
    }
    /* 用伪元素遮挡，切成圆角 */
    .container .card .img-box::after {
      content: '';
      position:absolute;
      width: 20px;
      height: 20px;
      /* background-color: red; */
      background-color: transparent;
      right: -30px;
      border-top-left-radius: 20px;
      transform: translateY(-100px);
      opacity: 0;
      box-shadow: -5px -5px 0 4px var(--color);
      pointer-events: none;
      transition: .5s;
    }
    .container .card:hover .img-box::after {
      transform: translateY(50px);
      opacity: 1;
    }
    .container .card .img-box::before {
      content: '';
      position:absolute;
      width: 20px;
      height: 20px;
      background-color: transparent;
      left: -30px;
      border-top-right-radius: 20px;
      transform: translateY(-100px);
      opacity: 0;
      box-shadow: 5px -5px 0 4px var(--color);
      pointer-events: none;
      transition: .5s;
    }
    .container .card:hover .img-box::before {
      transform: translateY(50px);
      opacity: 1;
    }
    /* 文字 */
    .container .card p {
      position: relative;
      padding:40px;
      font-size: 16px;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(-50px);
      transition: .5s;
    }
    .container .card:hover p {
      transform: translateY(40px);
      opacity: 1;
    }

    .container .card h2 {
      position: absolute;
      bottom: 8px;
      color: #333;
      transition: .5s;
      font-weight: 600;
    }
    .container .card:hover h2 {
      padding: 5px 25px;
      background-color: #2d76e2;
      color: #fff;
      bottom: -24px;
      border-radius: 15px;
      box-shadow: 0 0 0 10px var(--color);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="img-box">
        <img src="../../assets/images/windows-xp.jpg" alt="">
      </div>
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Inventore ex culpa fugiat totam deserunt! Vero eligendi, tenetur, dolorem consequuntur quo saepe sequi ad iusto sunt deleniti molestias eaque amet rem.</p>
      <h2>Title</h2>
    </div>
  </div>
</body>
</html>
